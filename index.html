<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f9fb" />
    <meta
      name="description"
      content="Метрика: интерактивный учебный стенд о погрешностях измерений, их классификации и свойствах средств измерений. Теория, виртуальные приборы, практикум и тест."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Метрика. Погрешности и средства измерений</title>
    <script>
      // Тему задаём до первой отрисовки, иначе при тёмной теме мигнёт светлый фон.
      (function () {
        try {
          var saved = localStorage.getItem("metrika-theme");
          var theme =
            saved ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
